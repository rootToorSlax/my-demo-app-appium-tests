app.path=apps/mda-2.3.0-27.apk
apk.version.name=2.3.0
app.package=com.saucelabs.mydemoapp.android
app.activity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity
device.name=Pixel_7_API_34
avd=Pixel_7_API_34
udid=
new.command.timeout.seconds=60
ui.wait.seconds=10
ui.wait.seconds.long=15
catalog.product.wait.seconds=10
cart.empty.wait.seconds=12
adb.shell.timeout.seconds=25
language=en
locale=US
appium.server.url=
screenshots.runs.to.keep=3
startup.budget.ms=3000
# fast = local (no per-test logcat/oracle, no overlay sweep each wait). strict = CI / GATE (set HARNESS_PROFILE=strict).
harness.profile=fast
# After gradlew test JVM exit: adb emu kill when Appium started the AVD (udid empty). Default true; false while debugging.
kill.after.testrun=true
# Audio policy (single source of truth for tests + scripts/apply-mute.cmd + emulator -no-audio).
# true  = silent always (boot, session reset, app kill/relaunch, --rerun-tasks). Reviewer sound: set false here or MUTE_ANDROID_SYSTEM=false.
mute.android.system=true
