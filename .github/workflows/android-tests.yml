name: Android tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      - name: Download the pinned APK
        run: |
          mkdir -p apps
          curl -fsSL -o apps/mda-2.3.0-27.apk \
            https://github.com/saucelabs/my-demo-app-android/releases/download/2.3.0/mda-2.3.0-27.apk

      - name: Run the suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_7_API_34
          disable-animations: true
          emulator-boot-timeout-in-minutes: 15
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio
          script: |
            sdkmanager "build-tools;34.0.0"
            chmod +x ./gradlew
            echo "Waiting for adb device + sys.boot_completed (reconnect offline)..."
            adb wait-for-device
            ready=0
            for attempt in $(seq 1 120); do
              adb reconnect offline >/dev/null 2>&1 || true
              state=$(adb devices | awk '/^emulator-/{print $2; exit}')
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
                ready=1
                break
              fi
              sleep 2
            done
            adb devices -l
            if [ "$ready" != "1" ]; then
              echo "Emulator did not reach device+boot_completed in time"
              exit 1
            fi
            serial=$(adb devices | awk '/\tdevice$/{print $1; exit}')
            export UDID="$serial"
            export HARNESS_PROFILE=strict
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              ./gradlew smokeTest --no-daemon
            else
              ./gradlew test --no-daemon
            fi

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "build/test-results/**/*.xml"
          include_passed: true

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: build/failure-evidence
          if-no-files-found: ignore
