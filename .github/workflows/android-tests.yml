name: Android tests

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      - name: Download the pinned APK
        run: |
          mkdir -p apps
          curl -fsSL -o apps/mda-2.3.0-27.apk \
            https://github.com/saucelabs/my-demo-app-android/releases/download/2.3.0/mda-2.3.0-27.apk

      - name: Run the suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_7_API_34
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect
          script: |
            sdkmanager "build-tools;34.0.0"
            chmod +x ./gradlew
            serial=$(adb devices | awk '/\tdevice$/{print $1; exit}')
            export UDID="$serial"
            ./gradlew test --no-daemon

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: build/failure-evidence
          if-no-files-found: ignore
