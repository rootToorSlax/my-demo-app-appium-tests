name: Android tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      - name: Download the pinned APK
        run: |
          mkdir -p apps
          curl -fsSL -o apps/mda-2.3.0-27.apk \
            https://github.com/saucelabs/my-demo-app-android/releases/download/2.3.0/mda-2.3.0-27.apk

      # Without KVM, android-emulator-runner adds -accel off and boot can exceed 10 min.
      - name: Enable KVM on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_7_API_34
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 1200
          ram-size: 3072M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio -no-metrics
          script: |
            sdkmanager "build-tools;34.0.0"
            chmod +x ./gradlew
            adb reconnect offline >/dev/null 2>&1 || true
            serial=$(adb devices | awk '/\tdevice$/{print $1; exit}')
            if [ -z "$serial" ]; then
              echo "No adb device in ready state after emulator boot"
              adb devices -l
              exit 1
            fi
            export UDID="$serial"
            export HARNESS_PROFILE=strict
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              ./gradlew smokeTest --no-daemon
            else
              ./gradlew test --no-daemon
            fi

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "build/test-results/**/*.xml"
          include_passed: true

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: build/failure-evidence
          if-no-files-found: ignore
